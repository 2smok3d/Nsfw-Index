<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#06060f;--s1:#0d0d1c;--s2:#111126;--s3:#181836;--s4:#1e1e42;
  --accent:#e91e8c;--accent2:#9c27b0;
  --grad:linear-gradient(135deg,#e91e8c,#9c27b0);
  --text:#f0f0fa;--t2:#8888b0;--t3:#44446a;
  --border:rgba(255,255,255,0.06);--b2:rgba(233,30,140,0.3);
  --glow:rgba(233,30,140,0.22);
  --radius:14px;--hh:58px;--nh:46px;
}
html{scroll-behavior:smooth;overflow-x:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;overflow-x:hidden;
}
*{-webkit-tap-highlight-color:transparent}

/* ── AGE GATE ── */
#gate{
  position:fixed;inset:0;z-index:9000;
  background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  padding:24px;
}
#gate.hidden{display:none}
.gate-glow{
  position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse 70% 50% at 25% 40%,rgba(233,30,140,.14),transparent 65%),
    radial-gradient(ellipse 55% 60% at 78% 65%,rgba(156,39,176,.10),transparent 65%);
}
.gate-box{
  position:relative;z-index:1;
  max-width:400px;width:100%;text-align:center;
  background:rgba(13,13,28,.95);
  border:1px solid rgba(233,30,140,.2);
  border-radius:20px;padding:44px 32px 36px;
  box-shadow:0 0 80px rgba(233,30,140,.08),0 32px 60px rgba(0,0,0,.8);
}
.gate-logo{
  font-size:2.6rem;font-weight:900;letter-spacing:-1px;
  background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:4px;line-height:1;
}
.gate-eyebrow{
  font-size:.65rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
  color:var(--accent);opacity:.7;margin-bottom:22px;
}
.gate-msg{color:var(--t2);font-size:.87rem;line-height:1.65;margin-bottom:32px}
.gate-enter{
  display:block;width:100%;padding:15px;
  background:var(--grad);border:none;border-radius:12px;
  color:#fff;font-size:1rem;font-weight:700;cursor:pointer;
  box-shadow:0 6px 24px rgba(233,30,140,.38);
  transition:all .2s;margin-bottom:12px;
}
.gate-enter:hover{filter:brightness(1.1);transform:translateY(-2px);box-shadow:0 10px 32px rgba(233,30,140,.5)}
.gate-exit{
  display:block;width:100%;padding:12px;
  background:none;border:1px solid var(--border);border-radius:12px;
  color:var(--t2);font-size:.88rem;cursor:pointer;transition:all .2s;
}
.gate-exit:hover{color:var(--text);border-color:rgba(255,255,255,.14)}
@media(max-width:440px){.gate-box{border-radius:16px;padding:36px 20px 28px}}

/* ── HEADER ── */
#hdr{
  position:sticky;top:0;z-index:500;
  height:var(--hh);
  background:rgba(6,6,15,.92);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;padding:0 14px;
}
.logo{
  font-size:1.05rem;font-weight:900;letter-spacing:.02em;
  background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  flex-shrink:0;white-space:nowrap;
}
.srch-wrap{flex:1;position:relative;min-width:0}
#search{
  width:100%;height:38px;
  background:var(--s2);
  border:1px solid var(--border);border-radius:20px;
  color:var(--text);font-size:.88rem;
  padding:0 38px 0 16px;
  outline:none;-webkit-appearance:none;
  transition:border-color .2s,box-shadow .2s;
}
#search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(233,30,140,.13)}
#search::placeholder{color:var(--t3)}
#search::-webkit-search-cancel-button{display:none}
.srch-clr{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  background:none;border:none;color:var(--t3);cursor:pointer;
  font-size:.95rem;padding:3px;display:none;line-height:1;
  transition:color .15s;
}
.srch-clr:hover{color:var(--text)}
.hact{
  width:36px;height:36px;border-radius:10px;
  background:var(--s2);border:1px solid var(--border);
  color:var(--t2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:1rem;flex-shrink:0;
  transition:all .18s;
}
.hact:hover{background:var(--s3);color:var(--text);border-color:rgba(233,30,140,.2)}
.hact.on{background:rgba(233,30,140,.15);border-color:var(--accent);color:var(--accent)}
@media(max-width:360px){.logo{font-size:.85rem}}

/* ── CATEGORY NAV ── */
#cnav{
  position:sticky;top:var(--hh);z-index:499;
  background:rgba(6,6,15,.88);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  display:flex;gap:6px;padding:8px 14px;
  overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
#cnav::-webkit-scrollbar{display:none}
.cpill{
  padding:6px 16px;border-radius:20px;
  background:transparent;border:1px solid transparent;
  color:var(--t2);font-size:.8rem;font-weight:500;
  white-space:nowrap;cursor:pointer;flex-shrink:0;
  transition:all .18s;
}
.cpill:hover{color:var(--text);background:var(--s2);border-color:var(--border)}
.cpill.on{
  background:rgba(233,30,140,.14);
  border-color:var(--accent);
  color:var(--accent);font-weight:600;
}

/* ── MAIN ── */
#main{
  max-width:1440px;margin:0 auto;
  padding:24px 14px 60px;
}

/* ── SECTION ── */
.sec{margin-bottom:40px}
.sec-hdr{
  display:flex;align-items:baseline;gap:10px;
  margin-bottom:16px;padding-bottom:10px;
  border-bottom:1px solid var(--border);
}
.sec-title{font-size:1rem;font-weight:700;color:var(--text)}
.sec-count{font-size:.75rem;color:var(--t3)}

/* ── HERO GRID (starred items) ── */
.hero-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:10px;margin-bottom:10px;
}
@media(max-width:500px){.hero-grid{grid-template-columns:repeat(2,1fr)}}

.hcard{
  position:relative;cursor:pointer;
  border-radius:var(--radius);overflow:hidden;
  min-height:110px;
  padding:16px 14px 14px;
  display:flex;flex-direction:column;justify-content:flex-end;
  background:linear-gradient(145deg,rgba(233,30,140,.09),rgba(156,39,176,.09));
  border:1px solid rgba(233,30,140,.22);
  transition:transform .2s,box-shadow .2s,border-color .2s;
  user-select:none;
}
.hcard::before{
  content:'';position:absolute;inset:0;
  background:var(--grad);opacity:.05;
  transition:opacity .2s;pointer-events:none;
}
.hcard:hover{
  transform:translateY(-4px);
  box-shadow:0 12px 40px rgba(233,30,140,.3),0 0 0 1px rgba(233,30,140,.4);
}
.hcard:hover::before{opacity:.11}
.hcard:active{transform:translateY(-1px)}
.hc-hot{
  position:absolute;top:10px;left:10px;
  background:var(--grad);
  font-size:.58rem;font-weight:800;letter-spacing:.1em;
  padding:2px 7px;border-radius:5px;color:#fff;text-transform:uppercase;
}
.hc-fav{
  position:absolute;top:8px;right:8px;
  width:28px;height:28px;border-radius:50%;
  background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.08);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:.85rem;color:var(--t3);
  transition:all .18s;
}
.hc-fav:hover,.hc-fav.on{color:var(--accent)}
.hc-fav.on{background:rgba(233,30,140,.18);border-color:rgba(233,30,140,.35)}
.hc-name{
  font-size:.95rem;font-weight:700;color:var(--text);
  line-height:1.25;margin-bottom:3px;
}
.hc-note{font-size:.72rem;color:var(--t2)}

/* ── REGULAR CARD GRID ── */
.card-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:8px;
}
@media(max-width:480px){.card-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:300px){.card-grid{grid-template-columns:1fr}}

.card{
  position:relative;cursor:pointer;
  border-radius:var(--radius);
  background:var(--s1);
  border:1px solid var(--border);
  padding:14px 12px 12px;
  display:flex;flex-direction:column;gap:3px;
  min-height:72px;
  transition:transform .18s,box-shadow .18s,border-color .18s,background .18s;
  user-select:none;
}
.card:hover{
  transform:translateY(-3px);
  box-shadow:0 8px 28px var(--glow);
  border-color:rgba(233,30,140,.32);
  background:var(--s2);
}
.card:active{transform:translateY(0)}
.card.starred{border-color:rgba(233,30,140,.16);background:rgba(233,30,140,.03)}
.card.faved{border-color:rgba(233,30,140,.28)}

.c-fav{
  position:absolute;top:8px;right:8px;
  width:26px;height:26px;
  background:none;border:none;cursor:pointer;
  font-size:.82rem;color:var(--t3);
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;transition:all .15s;
}
.c-fav:hover,.c-fav.on{color:var(--accent)}
.c-fav.on{color:var(--accent)}
.c-hot{
  font-size:.58rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:1px;
}
.c-name{
  font-size:.86rem;font-weight:600;color:var(--text);
  line-height:1.3;padding-right:22px;
}
.c-note{font-size:.7rem;color:var(--t2);line-height:1.3}
.c-srch{
  position:absolute;bottom:8px;right:8px;
  width:22px;height:22px;
  background:none;border:none;cursor:pointer;
  font-size:.82rem;color:var(--t3);
  display:flex;align-items:center;justify-content:center;
  border-radius:6px;transition:color .15s;
}
.c-srch:hover{color:var(--t2)}

/* ── EMPTY STATE ── */
.empty{
  text-align:center;padding:72px 20px;color:var(--t2);
}
.empty-icon{font-size:2.4rem;margin-bottom:12px}
.empty-txt{font-size:.9rem}

/* ── SEARCH ALL MODAL ── */
#cs-modal{
  display:none;position:fixed;inset:0;z-index:800;
  background:rgba(6,6,15,.75);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  align-items:flex-end;justify-content:center;
  padding-bottom:env(safe-area-inset-bottom,0);
}
#cs-modal.open{display:flex}
.cs-sheet{
  width:100%;max-width:620px;
  background:var(--s1);
  border:1px solid rgba(233,30,140,.18);
  border-radius:22px 22px 0 0;
  padding:12px 20px 28px;
  animation:sheetUp .28s cubic-bezier(.34,1.4,.64,1) both;
}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.cs-handle{
  width:40px;height:4px;background:var(--t3);
  border-radius:2px;margin:0 auto 18px;
}
.cs-title{font-size:.95rem;font-weight:700;text-align:center;margin-bottom:14px}
#csinput{
  display:block;width:100%;height:46px;
  background:var(--s2);border:1px solid var(--border);border-radius:12px;
  color:var(--text);font-size:.93rem;padding:0 16px;
  outline:none;margin-bottom:16px;
  transition:border-color .2s;
}
#csinput:focus{border-color:var(--accent)}
.cs-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.cs-chip{
  padding:8px 16px;border-radius:9px;
  background:var(--s3);border:1px solid var(--border);
  color:var(--t2);font-size:.82rem;cursor:pointer;
  transition:all .15s;
}
.cs-chip:hover{
  background:rgba(233,30,140,.15);
  border-color:var(--accent);color:var(--text);
}
.cs-dismiss{
  display:block;width:100%;padding:12px;
  background:var(--s3);border:1px solid var(--border);border-radius:12px;
  color:var(--t2);font-size:.88rem;cursor:pointer;transition:all .15s;
}
.cs-dismiss:hover{color:var(--text)}

/* ── TOAST ── */
#toast{
  position:fixed;bottom:28px;left:50%;
  transform:translateX(-50%) translateY(70px);
  background:var(--s3);border:1px solid var(--b2);
  color:var(--text);padding:9px 20px;border-radius:9px;
  font-size:.83rem;z-index:700;pointer-events:none;
  transition:transform .3s cubic-bezier(.34,1.5,.64,1),opacity .3s;
  opacity:0;white-space:nowrap;
  box-shadow:0 4px 20px rgba(0,0,0,.5);
}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* ── SCROLL TOP ── */
#stb{
  position:fixed;bottom:28px;right:16px;z-index:600;
  width:42px;height:42px;border-radius:50%;
  background:var(--grad);border:none;
  color:#fff;font-size:1.1rem;cursor:pointer;
  display:none;align-items:center;justify-content:center;
  box-shadow:0 4px 18px rgba(233,30,140,.4);
  transition:transform .2s,box-shadow .2s;
}
#stb:hover{transform:scale(1.1);box-shadow:0 6px 26px rgba(233,30,140,.6)}
#stb.vis{display:flex}

/* ── SAFE AREA ── */
@supports(padding-bottom:env(safe-area-inset-bottom)){
  #main{padding-bottom:calc(60px + env(safe-area-inset-bottom))}
  #stb{bottom:calc(28px + env(safe-area-inset-bottom))}
  #toast{bottom:calc(28px + env(safe-area-inset-bottom))}
}

/* ── ALWAYS SHOW FAV BTN ON TOUCH ── */
@media(hover:none){
  .c-fav{color:var(--t2)}
  .hc-fav{color:var(--t2)}
}
</style>
</head>

const CATS=[
  {id:'stepmom',label:'Stepmom & Taboo'},
  {id:'stream',label:'Free Streaming'},
  {id:'clips',label:'Clips & Reels'},
  {id:'ai',label:'AI Content'},
  {id:'dl',label:'Download Tools'},
  {id:'tools',label:'Apps & Tools'},
];

// ── STATE ──
const S={cat:'all',q:'',favs:new Set(),showFavs:false};

function loadFavs(){
  try{const f=localStorage.getItem('nf');if(f)S.favs=new Set(JSON.parse(f))}catch(e){}
}
function saveFavs(){
  try{localStorage.setItem('nf',JSON.stringify([...S.favs]))}catch(e){}
}

// ── AGE GATE ──
function checkGate(){
  if(!localStorage.getItem('na'))document.getElementById('gate').classList.remove('hidden');
  else document.getElementById('gate').classList.add('hidden');
}
function enterSite(){
  localStorage.setItem('na','1');
  document.getElementById('gate').classList.add('hidden');
}

// ── TOAST ──
let _tt;
function toast(msg,accent){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.style.borderColor=accent?'rgba(233,30,140,.4)':'';
  t.classList.add('show');
  clearTimeout(_tt);
  _tt=setTimeout(()=>t.classList.remove('show'),2200);
}

// ── OPEN LINK — whole card is the button ──
function oLink(u){window.open(u,'_blank')}

// ── CATEGORY ──
function setCat(cat){
  S.cat=cat;S.showFavs=false;
  document.querySelectorAll('.cpill').forEach(p=>p.classList.toggle('on',p.dataset.cat===cat));
  document.getElementById('fav-btn').classList.remove('on');
  render();
}

// ── SEARCH ──
function onSearch(v){
  S.q=v.trim();
  document.getElementById('sclr').style.display=v?'block':'none';
  render();
}
function clrSearch(){
  const el=document.getElementById('search');
  el.value='';onSearch('');el.focus();
}

// ── FAVORITES ──
function toggleFavView(){
  S.showFavs=!S.showFavs;
  document.getElementById('fav-btn').classList.toggle('on',S.showFavs);
  render();
}
function toggleFav(e,u){
  e.stopPropagation();
  const had=S.favs.has(u);
  if(had){S.favs.delete(u);toast('Removed from saved')}
  else{S.favs.add(u);toast('Saved ♥',true)}
  saveFavs();render();
}

// ── RANDOM ──
function randSite(){
  const pool=(S.cat==='all'?DATA:DATA.filter(d=>d.c===S.cat));
  if(!pool.length)return;
  const item=pool[Math.floor(Math.random()*pool.length)];
  oLink(item.u);toast('Opening: '+item.n);
}

// ── CROSS-SITE SEARCH MODAL ──
function openCS(){
  const q=document.getElementById('search').value.trim();
  const inp=document.getElementById('csinput');
  inp.value=q;
  document.getElementById('cs-grid').innerHTML=CSSITES.map(s=>
    `<button class="cs-chip" data-base="${s.u}" onclick="csGo(this)">${s.n}</button>`
  ).join('');
  document.getElementById('cs-modal').classList.add('open');
  setTimeout(()=>inp.select(),80);
}
function csGo(btn){
  const q=(document.getElementById('csinput').value.trim()||document.getElementById('search').value.trim());
  if(!q){toast('Enter a search term first');return}
  window.open(btn.dataset.base+encodeURIComponent(q),'_blank');
}
function closeCS(){
  document.getElementById('cs-modal').classList.remove('open');
}

// ── SITE SEARCH (per-card) ──
function siteSearch(e,su){
  e.stopPropagation();
  const q=document.getElementById('search').value.trim();
  window.open(su+encodeURIComponent(q||'stepmom'),'_blank');
}

// ── FILTER ──
function filtered(){
  let d=DATA;
  if(S.showFavs)return d.filter(x=>S.favs.has(x.u));
  if(S.cat!=='all')d=d.filter(x=>x.c===S.cat);
  if(S.q){
    const q=S.q.toLowerCase();
    d=d.filter(x=>x.n.toLowerCase().includes(q)||(x.note||'').toLowerCase().includes(q));
  }
  return d;
}

// ── TEMPLATES ──
function hcard(lnk){
  const eu=lnk.u.replace(/'/g,"\\'");
  const fav=S.favs.has(lnk.u);
  return`<div class="hcard" onclick="oLink('${eu}')">
    <div class="hc-hot">HOT</div>
    <button class="hc-fav${fav?' on':''}" onclick="toggleFav(event,'${eu}')" title="${fav?'Unsave':'Save'}">♥</button>
    <div class="hc-name">${lnk.n}</div>
    ${lnk.note?`<div class="hc-note">${lnk.note}</div>`:''}
  </div>`;
}

function card(lnk){
  const eu=lnk.u.replace(/'/g,"\\'");
  const fav=S.favs.has(lnk.u);
  const esu=lnk.su?lnk.su.replace(/'/g,"\\'"):'';
  return`<div class="card${lnk.s?' starred':''}${fav?' faved':''}" onclick="oLink('${eu}')">
    <button class="c-fav${fav?' on':''}" onclick="toggleFav(event,'${eu}')" title="${fav?'Unsave':'Save'}">♥</button>
    ${lnk.s?'<div class="c-hot">HOT</div>':''}
    <div class="c-name">${lnk.n}</div>
    ${lnk.note?`<div class="c-note">${lnk.note}</div>`:''}
    ${lnk.su?`<button class="c-srch" onclick="siteSearch(event,'${esu}')" title="Search this site">⌕</button>`:''}
  </div>`;
}

// ── RENDER ──
function render(){
  const el=document.getElementById('content');
  const data=filtered();

  if(!data.length){
    el.innerHTML=`<div class="empty"><div class="empty-icon">🔍</div><div class="empty-txt">No results found</div></div>`;
    return;
  }

  if(S.showFavs){
    el.innerHTML=`<div class="sec">
      <div class="sec-hdr"><div class="sec-title">Saved Sites</div><div class="sec-count">${data.length}</div></div>
      <div class="card-grid">${data.map(card).join('')}</div>
    </div>`;
    return;
  }

  if(S.q){
    el.innerHTML=`<div class="sec">
      <div class="sec-hdr"><div class="sec-title">Results for &ldquo;${S.q}&rdquo;</div><div class="sec-count">${data.length} sites</div></div>
      <div class="card-grid">${data.map(card).join('')}</div>
    </div>`;
    return;
  }

  // Single category view
  if(S.cat!=='all'){
    const cat=CATS.find(c=>c.id===S.cat);
    const heroes=data.filter(x=>x.s);
    const rest=data.filter(x=>!x.s);
    el.innerHTML=`<div class="sec">
      <div class="sec-hdr"><div class="sec-title">${cat?.label||S.cat}</div><div class="sec-count">${data.length}</div></div>
      ${heroes.length?`<div class="hero-grid">${heroes.map(hcard).join('')}</div>`:''}
      ${rest.length?`<div class="card-grid">${rest.map(card).join('')}</div>`:''}
    </div>`;
    return;
  }

  // All categories
  let html='';
  for(const cat of CATS){
    const items=DATA.filter(d=>d.c===cat.id);
    if(!items.length)continue;
    const heroes=items.filter(x=>x.s);
    const rest=items.filter(x=>!x.s);
    html+=`<div class="sec">
      <div class="sec-hdr"><div class="sec-title">${cat.label}</div><div class="sec-count">${items.length}</div></div>
      ${heroes.length?`<div class="hero-grid">${heroes.map(hcard).join('')}</div>`:''}
      ${rest.length?`<div class="card-grid">${rest.map(card).join('')}</div>`:''}
    </div>`;
  }
  el.innerHTML=html;
}

// ── KEYBOARD SHORTCUTS ──
document.addEventListener('keydown',e=>{
  const tag=document.activeElement.tagName;
  const inInput=tag==='INPUT'||tag==='TEXTAREA';
  if(e.key==='/'&&!inInput){e.preventDefault();document.getElementById('search').focus()}
  if(e.key==='Escape'){closeCS();if(S.q)clrSearch()}
  if(!inInput&&e.key.toLowerCase()==='r')randSite();
  if(!inInput&&e.key.toLowerCase()==='f')toggleFavView();
  if(!inInput&&e.key.toLowerCase()==='s')openCS();
});

// ── SCROLL TOP ──
window.addEventListener('scroll',()=>{
  document.getElementById('stb').classList.toggle('vis',scrollY>500);
},{passive:true});

// ── INIT ──
document.getElementById('gate').classList.add('hidden');
loadFavs();
checkGate();
render();
</script>
