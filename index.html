<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Noir Index</title>
<meta name="theme-color" content="#0a0808">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Noir Index">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="assets/css/theme.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2718%27 fill=%27%230a0808%27/%3E%3Ctext x=%2750%27 y=%2568%27 font-size=%2755%27 text-anchor=%27middle%27 fill=%27%23c9a24b%27%3E%E2%99%9B%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
</head>
<body>
<div id="nb-gate"></div>
<div id="nb-header"></div>

<main id="main">
  <div id="view"></div>
  <footer class="site" id="nb-footer"></footer>
</main>

<div id="nb-toast"></div>
<button id="nb-stb" title="Back to top">↑</button>

<script src="assets/js/store.js"></script>
<script src="assets/data/sites.js"></script>
<script src="assets/js/router.js"></script>
<script src="assets/js/nav.js"></script>
<script src="assets/js/palette.js"></script>
<script src="assets/js/views/home.js"></script>
<script src="assets/js/views/directory.js"></script>
<script src="assets/js/views/search.js"></script>
<script src="assets/js/views/tools.js"></script>
<script src="assets/js/views/settings.js"></script>
<script>
  (function boot() {
    NB.initChrome();
    Router.setDefault('/');
    const landing = Store.getSettings().landingPage;
    if (landing && landing !== '/' && location.hash.length <= 1 && !sessionStorage.getItem('nb_landed')) {
      sessionStorage.setItem('nb_landed', '1');
      location.hash = landing;
    } else {
      Router.render();
    }
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  })();
</script>
</body>
</html>
