*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#06060f;--s1:#0d0d1c;--s2:#111126;--s3:#181836;
  --accent:#e91e8c;--accent2:#9c27b0;

html{scroll-behavior:smooth;overflow-x:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
*{-webkit-tap-highlight-color:transparent}

/* ── AGE GATE ── */
#gate{position:fixed;inset:0;z-index:9000;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#gate.hidden{display:none}
.gate-glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 70% 50% at 25% 40%,rgba(233,30,140,.14),transparent 65%),radial-gradient(ellipse 55% 60% at 78% 65%,rgba(156,39,176,.10),transparent 65%)}
.gate-box{position:relative;z-index:1;max-width:400px;width:100%;text-align:center;background:rgba(13,13,28,.96);border:1px solid rgba(233,30,140,.2);border-radius:20px;padding:44px 32px 36px;box-shadow:0 0 80px rgba(233,30,140,.08),0 32px 60px rgba(0,0,0,.8)}
.gate-logo{font-size:2.6rem;font-weight:900;letter-spacing:-1px;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px}
.gate-eyebrow{font-size:.65rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);opacity:.7;margin-bottom:22px}
.gate-msg{color:var(--t2);font-size:.87rem;line-height:1.65;margin-bottom:32px}
.gate-enter{display:block;width:100%;padding:15px;background:var(--grad);border:none;border-radius:12px;color:#fff;font-size:1rem;font-weight:700;cursor:pointer;box-shadow:0 6px 24px rgba(233,30,140,.38);transition:all .2s;margin-bottom:12px}
.gate-enter:hover{filter:brightness(1.1);transform:translateY(-2px);box-shadow:0 10px 32px rgba(233,30,140,.5)}
.gate-exit{display:block;width:100%;padding:12px;background:none;border:1px solid var(--border);border-radius:12px;color:var(--t2);font-size:.88rem;cursor:pointer;transition:all .2s}
.gate-exit:hover{color:var(--text);border-color:rgba(255,255,255,.14)}
@media(max-width:440px){.gate-box{border-radius:16px;padding:36px 20px 28px}}

/* ── HEADER (2 rows) ── */
#hdr{
  position:sticky;top:0;z-index:500;
  background:rgba(6,6,15,.95);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-bottom:1px solid var(--border);
  padding:10px 12px 0;
}
.hdr-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.logo{font-size:1rem;font-weight:900;letter-spacing:.02em;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;flex-shrink:0;white-space:nowrap}

/* search */
.srch-wrap{flex:1;position:relative;min-width:0;display:flex;align-items:center}
.srch-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--t3);font-size:.95rem;pointer-events:none}
#search{width:100%;height:40px;background:var(--s2);border:1.5px solid var(--border);border-radius:20px;color:var(--text);font-size:.9rem;padding:0 40px 0 38px;outline:none;-webkit-appearance:none;transition:border-color .2s,box-shadow .2s,background .2s}
#search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(233,30,140,.12);background:var(--s3)}
#search::placeholder{color:var(--t3)}
#search::-webkit-search-cancel-button{display:none}
.srch-clr{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:rgba(233,30,140,.12);border:none;color:var(--accent);cursor:pointer;width:22px;height:22px;border-radius:50%;font-size:.72rem;display:none;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0}
.srch-clr:hover{background:rgba(233,30,140,.28)}
.srch-clr.vis{display:flex}

/* fav button */
.hact{width:36px;height:36px;border-radius:10px;background:var(--s2);border:1px solid var(--border);color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;transition:all .18s}
.hact:hover{background:var(--s3);color:var(--text);border-color:rgba(233,30,140,.2)}
.hact.on{background:rgba(233,30,140,.15);border-color:var(--accent);color:var(--accent)}

/* category nav */
.cat-nav{display:flex;gap:5px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none;-ms-overflow-style:none;-webkit-overflow-scrolling:touch}
.cat-nav::-webkit-scrollbar{display:none}
.cat-tab{flex-shrink:0;padding:5px 14px;border-radius:18px;border:1px solid var(--border);background:none;color:var(--t2);font-size:.76rem;font-weight:600;cursor:pointer;transition:all .18s;white-space:nowrap;letter-spacing:.01em}
.cat-tab:hover{color:var(--text);border-color:rgba(233,30,140,.3);background:var(--s2)}
.cat-tab.active{background:rgba(233,30,140,.12);border-color:rgba(233,30,140,.4);color:var(--accent)}

@media(max-width:380px){.logo{display:none}#search{padding-left:12px}.srch-icon{display:none}}

/* ── MAIN ── */
#main{max-width:1440px;margin:0 auto;padding:14px 12px 80px}

/* ── SECTION ── */
.sec{margin-bottom:5px}
.sec-hdr{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:var(--radius);cursor:pointer;user-select:none;background:var(--s1);border:1px solid var(--border);transition:background .15s,border-color .15s;scroll-margin-top:108px}
.sec-hdr:hover{background:var(--s2);border-color:rgba(233,30,140,.2)}
.sec-title{font-size:.93rem;font-weight:700;color:var(--text);transition:color .15s}
.sec-hdr:hover .sec-title{color:var(--accent)}
.sec-count{font-size:.7rem;color:var(--t3)}
.sec-chev{margin-left:auto;color:var(--t3);font-size:.78rem;font-weight:600;transition:transform .26s cubic-bezier(.4,0,.2,1);flex-shrink:0}
.sec-hdr.open .sec-chev{transform:rotate(90deg)}
.sec-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s cubic-bezier(.4,0,.2,1)}
.sec-body.open{grid-template-rows:1fr}
.sec-inner{overflow:hidden;min-height:0}
.sec-pad{padding-top:8px;padding-bottom:2px}

/* ── HERO GRID ── */
.hero-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;margin-bottom:8px}
@media(max-width:500px){.hero-grid{grid-template-columns:repeat(2,1fr)}}

.hcard{position:relative;cursor:pointer;border-radius:var(--radius);overflow:hidden;min-height:104px;padding:14px 12px 12px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(145deg,rgba(233,30,140,.09),rgba(156,39,176,.09));border:1px solid rgba(233,30,140,.22);transition:transform .2s,box-shadow .2s,border-color .2s;user-select:none;text-decoration:none;color:inherit}
.hcard::before{content:'';position:absolute;inset:0;background:var(--grad);opacity:.05;transition:opacity .2s;pointer-events:none}
.hcard:hover{transform:translateY(-4px);box-shadow:0 12px 36px rgba(233,30,140,.3),0 0 0 1px rgba(233,30,140,.4)}
.hcard:hover::before{opacity:.11}
.hcard:active{transform:translateY(-1px)}
.hc-hot{position:absolute;top:9px;left:9px;background:var(--grad);font-size:.54rem;font-weight:800;letter-spacing:.1em;padding:2px 6px;border-radius:4px;color:#fff;text-transform:uppercase}
.hc-fav{position:absolute;top:7px;right:7px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.08);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.82rem;color:var(--t3);transition:all .18s}
.hc-fav:hover,.hc-fav.on{color:var(--accent)}
.hc-fav.on{background:rgba(233,30,140,.18);border-color:rgba(233,30,140,.35)}
.hc-name{font-size:.92rem;font-weight:700;color:var(--text);line-height:1.25;margin-bottom:2px}
.hc-note{font-size:.7rem;color:var(--t2)}

/* ── CARD GRID ── */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:6px}
@media(max-width:480px){.card-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:300px){.card-grid{grid-template-columns:1fr}}

.card{position:relative;cursor:pointer;border-radius:var(--radius);background:var(--s1);border:1px solid var(--border);padding:12px 10px 10px;display:flex;flex-direction:column;gap:3px;min-height:64px;transition:transform .18s,box-shadow .18s,border-color .18s,background .18s;user-select:none;text-decoration:none;color:inherit}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 26px var(--glow);border-color:rgba(233,30,140,.32);background:var(--s2)}
.card:active{transform:translateY(0)}
.card.starred{border-color:rgba(233,30,140,.16);background:rgba(233,30,140,.03)}
.card.faved{border-color:rgba(233,30,140,.28)}

.c-fav:hover,.c-fav.on{color:var(--accent)}

.c-note{font-size:.68rem;color:var(--t2);line-height:1.3}
.c-srch{position:absolute;bottom:6px;right:6px;width:20px;height:20px;background:none;border:none;cursor:pointer;font-size:.76rem;color:var(--t3);display:flex;align-items:center;justify-content:center;border-radius:5px;transition:color .15s}
.c-srch:hover{color:var(--t2)}

.res-hdr strong{color:var(--text)}
.res-hdr span{color:var(--t3)}
.res-actions{display:flex;gap:8px;margin-bottom:12px}

.cs-sheet{width:100%;max-width:620px;background:var(--s1);border:1px solid rgba(233,30,140,.18);border-radius:20px 20px 0 0;padding:18px 16px 24px;animation:sheetUp .24s cubic-bezier(.34,1.3,.64,1) both}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.cs-label{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);margin-bottom:10px}
#csinput{display:block;width:100%;height:44px;background:var(--s2);border:1.5px solid var(--border);border-radius:11px;color:var(--text);font-size:.92rem;padding:0 14px;outline:none;margin-bottom:12px;transition:border-color .2s}
#csinput:focus{border-color:var(--accent)}
.cs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;margin-bottom:12px}
.cs-chip{padding:9px 10px;border-radius:9px;background:var(--s2);border:1px solid var(--border);color:var(--t2);font-size:.8rem;font-weight:600;cursor:pointer;transition:all .15s;text-align:center}

.cs-dismiss{display:block;width:100%;padding:10px;background:none;border:1px solid var(--border);border-radius:10px;color:var(--t2);font-size:.85rem;cursor:pointer;transition:all .15s}
.cs-dismiss:hover{color:var(--text);border-color:rgba(255,255,255,.14)}

#toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* ── SCROLL TOP ── */
#stb{position:fixed;bottom:28px;right:14px;z-index:600;width:40px;height:40px;border-radius:50%;background:var(--grad);border:none;color:#fff;font-size:1rem;cursor:pointer;display:none;align-items:center;justify-content:center;box-shadow:0 4px 18px rgba(233,30,140,.4);transition:transform .2s,box-shadow .2s}
#stb:hover{transform:scale(1.1);box-shadow:0 6px 26px rgba(233,30,140,.6)}

/* ── SAFE AREA ── */
@supports(padding-bottom:env(safe-area-inset-bottom)){
  #main{padding-bottom:calc(80px + env(safe-area-inset-bottom))}
  #stb{bottom:calc(28px + env(safe-area-inset-bottom))}
  #toast{bottom:calc(28px + env(safe-area-inset-bottom))}
}
</style>

function loadFavs(){try{const f=localStorage.getItem('nf');if(f)S.favs=new Set(JSON.parse(f))}catch(e){}}

function checkGate(){
  if(!localStorage.getItem('na'))document.getElementById('gate').classList.remove('hidden');

}

let _tt;
function toast(msg,accent){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.borderColor=accent?'rgba(233,30,140,.4)':'';
  t.classList.add('show');clearTimeout(_tt);
  _tt=setTimeout(()=>t.classList.remove('show'),2000);
}

function updateTabs(){
  document.querySelectorAll('.cat-tab').forEach(t=>{
    t.classList.toggle('active',!CLS.has(t.dataset.id));
  });
}

function toggleSec(id){
  const hdr=document.getElementById('sh-'+id);
  const body=document.getElementById('sb-'+id);
  if(!hdr||!body)return;
  const wasOpen=!CLS.has(id);
  if(wasOpen){
    CLS.add(id);body.classList.remove('open');hdr.classList.remove('open');
  } else {
    CATS.forEach(cat=>{
      if(cat.id===id)return;
      CLS.add(cat.id);
      document.getElementById('sb-'+cat.id)?.classList.remove('open');
      document.getElementById('sh-'+cat.id)?.classList.remove('open');
    });
    CLS.delete(id);body.classList.add('open');hdr.classList.add('open');
  }
  updateTabs();
}

function goTab(id){
  if(S.q){document.getElementById('search').value='';onSearch('')}
  if(S.showFavs){S.showFavs=false;document.getElementById('fav-btn').classList.remove('on');render()}
  if(CLS.has(id))toggleSec(id);
  setTimeout(()=>{
    document.getElementById('sh-'+id)?.scrollIntoView({behavior:'smooth',block:'start'});
  },50);
}

function toggleFavView(){
  S.showFavs=!S.showFavs;
  document.getElementById('fav-btn').classList.toggle('on',S.showFavs);

}
function toggleFav(e,u){
  e.preventDefault();e.stopPropagation();
  const had=S.favs.has(u);
  if(had){S.favs.delete(u);toast('Removed')}

}

function csGo(btn){
  const q=document.getElementById('csinput').value.trim()||document.getElementById('search').value.trim();

  window.open(btn.dataset.base+encodeURIComponent(q),'_blank');
}

function siteSearch(e,su){
  e.preventDefault();e.stopPropagation();
  const q=document.getElementById('search').value.trim();
  window.open(su+encodeURIComponent(q||'stepmom'),'_blank');
}

function filtered(){
  if(S.showFavs)return DATA.filter(x=>S.favs.has(x.u));
  if(!S.q)return DATA;
  const q=S.q.toLowerCase();
  return DATA.filter(x=>x.n.toLowerCase().includes(q)||(x.note||'').toLowerCase().includes(q));
}

function hcard(lnk){
  const eu=lnk.u.replace(/'/g,"\\'");const fav=S.favs.has(lnk.u);
  return`<a class="hcard" href="${lnk.u}" target="_blank">
    <div class="hc-hot">HOT</div>
    <button class="hc-fav${fav?' on':''}" onclick="toggleFav(event,'${eu}')">♥</button>
    <div class="hc-name">${lnk.n}</div>
    ${lnk.note?`<div class="hc-note">${lnk.note}</div>`:''}
  </a>`;
}

function card(lnk){
  const eu=lnk.u.replace(/'/g,"\\'");const fav=S.favs.has(lnk.u);
  const esu=lnk.su?lnk.su.replace(/'/g,"\\'"):'';
  return`<a class="card${lnk.s?' starred':''}${fav?' faved':''}" href="${lnk.u}" target="_blank">
    <button class="c-fav${fav?' on':''}" onclick="toggleFav(event,'${eu}')">♥</button>
    <div class="c-name">${lnk.n}</div>
    ${lnk.note?`<div class="c-note">${lnk.note}</div>`:''}
    ${lnk.su?`<button class="c-srch" onclick="siteSearch(event,'${esu}')" title="Search this site">⌕</button>`:''}
  </a>`;
}

function secBlock(cat,items){
  const isOpen=!CLS.has(cat.id);
  const heroes=items.filter(x=>x.s),rest=items.filter(x=>!x.s);
  return`<div class="sec">
    <div class="sec-hdr${isOpen?' open':''}" id="sh-${cat.id}" onclick="toggleSec('${cat.id}')">
      <div class="sec-title">${cat.label}</div>
      <div class="sec-count">${items.length}</div>
      <span class="sec-chev">›</span>
    </div>
    <div class="sec-body${isOpen?' open':''}" id="sb-${cat.id}">
      <div class="sec-inner"><div class="sec-pad">
        ${heroes.length?`<div class="hero-grid">${heroes.map(hcard).join('')}</div>`:''}
        ${rest.length?`<div class="card-grid">${rest.map(card).join('')}</div>`:''}
      </div></div>
    </div>
  </div>`;
}

function render(){
  const el=document.getElementById('content');
  const data=filtered();
  if(!data.length){
    el.innerHTML=`<div class="empty"><div class="empty-icon">🔍</div><div class="empty-txt">No results</div></div>`;
    return;
  }
  if(S.showFavs){
    el.innerHTML=`<div class="sec">
      <div class="sec-hdr open"><div class="sec-title">Saved</div><div class="sec-count">${data.length}</div></div>
      <div class="sec-body open"><div class="sec-inner"><div class="sec-pad">
        <div class="card-grid">${data.map(card).join('')}</div>
      </div></div></div></div>`;
    return;
  }
  if(S.q){
    el.innerHTML=`
      <div class="res-hdr"><strong>${data.length} results</strong> <span>for "${S.q}"</span></div>
      <div class="res-actions">
        <button class="res-btn primary" onclick="openCS()">⌕ Search all sites →</button>
      </div>
      <div class="card-grid">${data.map(card).join('')}</div>`;
    return;
  }
  el.innerHTML=CATS.map(cat=>{
    const items=DATA.filter(d=>d.c===cat.id);
    return items.length?secBlock(cat,items):'';
  }).join('');
}
