<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Directory — Noir Index</title>
<link rel="stylesheet" href="assets/css/theme.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2718%27 fill=%27%230a0808%27/%3E%3Ctext x=%2750%27 y=%2568%27 font-size=%2755%27 text-anchor=%27middle%27 fill=%27%23c9a24b%27%3E%E2%99%9B%3C/text%3E%3C/svg%3E">
</head>
<body data-page="directory">
<div id="nb-gate"></div>
<div id="nb-header"></div>
<div id="nb-mobilenav"></div>

<main id="main">
  <div class="eyebrow" style="margin-bottom:8px">The Directory</div>
  <h1 style="font-size:1.6rem;margin-bottom:14px">Taboo — one search box, free sites only</h1>

  <div class="panel" style="padding:16px 18px">
    <div class="small">Filter by tag:</div>
    <div class="chip-row mt" id="tagChips"></div>
  </div>

  <div id="content"></div>

  <footer class="site" id="nb-footer"></footer>
</main>

<!-- Cross-site search modal -->
<div class="modal-bg" id="cs-modal">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Search Across Sites</div>
    <input id="csinput" type="search" placeholder="Enter a search term…" autocomplete="off" style="width:100%;height:46px;padding:0 16px;margin-bottom:14px">
    <div class="chip-row" id="cs-grid" style="margin-bottom:14px"></div>
    <button class="btn btn-ghost" id="csClose">Dismiss</button>
  </div>
</div>

<div id="nb-toast"></div>
<button id="nb-stb" title="Back to top">↑</button>

<script src="assets/js/store.js"></script>
<script src="assets/js/nav.js"></script>
<script src="assets/data/sites.js"></script>
<script src="assets/js/directory.js"></script>
</body>
</html>
