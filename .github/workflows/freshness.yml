name: Weekly freshness check

# Re-verifies every sites.js entry against the live internet: dead
# domains, parked/lapsed domains, broken search patterns, and
# noFrame drift in both directions. Files or updates a single
# tracking issue with the report so it surfaces without digging
# through Actions logs, and auto-closes that issue on a clean run.
on:
  schedule:
    - cron: '0 6 * * 1' # every Monday, 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  freshness:
    name: Weekly freshness check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Drop the runner's pre-installed Google Chrome apt source
        # We only need Playwright's own bundled Chromium, never actual
        # Google Chrome — see ci.yml for why this source gets removed.
        run: sudo grep -rl 'dl\.google\.com/linux/chrome' /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f
      - run: npx playwright install --with-deps chromium
      - id: check
        run: node scripts/freshness-check.mjs freshness-report.md
        continue-on-error: true
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('freshness-report.md', 'utf8');
            const title = 'Weekly freshness check';
            const hadFindings = '${{ steps.check.outcome }}' === 'failure';

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100,
            });
            const existing = issues.find(i => i.title === title && !i.pull_request);

            if (hadFindings) {
              if (existing) {
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing.number, body, state: 'open',
                });
                if (existing.state === 'closed') {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner, repo: context.repo.repo,
                    issue_number: existing.number,
                    body: 'Reopened — this run found new issues, see the updated report above.',
                  });
                }
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner, repo: context.repo.repo, title, body,
                });
              }
            } else if (existing && existing.state === 'open') {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body, state: 'closed',
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number,
                body: 'All clear on this run — closing.',
              });
            }
      - name: Fail the job if issues were found
        if: steps.check.outcome == 'failure'
        run: exit 1
