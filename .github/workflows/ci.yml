name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Link & syntax verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run verify

  smoke:
    name: Browser smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Drop the runner's pre-installed Google Chrome apt source
        # We only need Playwright's own bundled Chromium, never actual
        # Google Chrome, so there's no reason to depend on this repo at
        # all — and it has, at times, served a package index out of sync
        # with its own signed Release file, failing `apt-get update` (and
        # so this whole job) on a source we don't even need.
        run: sudo grep -rl 'dl\.google\.com/linux/chrome' /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
